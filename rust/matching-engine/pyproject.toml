[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "matching-engine-rust"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
bindings = "pyo3"
module-name = "matching_engine_rust"
locked = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
